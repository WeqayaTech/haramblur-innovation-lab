<text x="70" y="452.0" font-size="12" fill="#1a1d25"><tspan font-weight="700" fill="#27ae60">Green</tspan> = correct outcome: every real child caught (32/32), every adult 18+ kept out of the Child class.</text>
<text x="70" y="470.0" font-size="12" fill="#1a1d25"><tspan font-weight="700" fill="#f39c12">Amber</tspan> = the teen band (13-17). LAGENDA ages are human <tspan font-style="italic">apparent-age</tspan> guesses (&#177;2-3 yrs), so these are annotation-noise disagreements.</text>
