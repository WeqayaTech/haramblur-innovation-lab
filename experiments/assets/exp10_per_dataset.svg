<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,sans-serif">
<rect width="900" height="470" fill="white"/>
<text x="450.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d25">Results per dataset — never pooled</text>
<text x="450.0" y="51" text-anchor="middle" font-size="12.5" fill="#8899aa">Each dataset answers a different question. Blue = keeping real people, red = removing non-people.</text>
<line x1="70" y1="350.0" x2="860" y2="350.0" stroke="#dfe3ea"/>
<text x="62" y="354.0" text-anchor="end" font-size="11" fill="#8899aa">0%</text>
<line x1="70" y1="285.5" x2="860" y2="285.5" stroke="#dfe3ea"/>
<text x="62" y="289.5" text-anchor="end" font-size="11" fill="#8899aa">25%</text>
<line x1="70" y1="221.0" x2="860" y2="221.0" stroke="#dfe3ea"/>
<text x="62" y="225.0" text-anchor="end" font-size="11" fill="#8899aa">50%</text>
<line x1="70" y1="156.5" x2="860" y2="156.5" stroke="#dfe3ea"/>
<text x="62" y="160.5" text-anchor="end" font-size="11" fill="#8899aa">75%</text>
<line x1="70" y1="92.0" x2="860" y2="92.0" stroke="#dfe3ea"/>
<text x="62" y="96.0" text-anchor="end" font-size="11" fill="#8899aa">100%</text>
<rect x="112.0" y="93.7" width="74.0" height="256.3" rx="3" fill="#2858dc"/>
<text x="149.0" y="85.7" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d25">99.3%</text>
<text x="149.0" y="368.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1d25">LAGENDA</text>
<text x="149.0" y="383.0" text-anchor="middle" font-size="10" fill="#8899aa">keep real people</text>
<text x="149.0" y="397.0" text-anchor="middle" font-size="10" fill="#8899aa">151/152</text>
<rect x="270.0" y="95.9" width="74.0" height="254.1" rx="3" fill="#2858dc"/>
<text x="307.0" y="87.9" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d25">98.5%</text>
<text x="307.0" y="368.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1d25">CrowdHuman</text>
<text x="307.0" y="383.0" text-anchor="middle" font-size="10" fill="#8899aa">keep real people</text>
<text x="307.0" y="397.0" text-anchor="middle" font-size="10" fill="#8899aa">2534/2573</text>
<rect x="428.0" y="94.5" width="74.0" height="255.5" rx="3" fill="#2858dc"/>
<text x="465.0" y="86.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d25">99.0%</text>
<text x="465.0" y="368.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1d25">LAGENDA</text>
<text x="465.0" y="383.0" text-anchor="middle" font-size="10" fill="#8899aa">gender correct</text>
<text x="465.0" y="397.0" text-anchor="middle" font-size="10" fill="#8899aa">104/105</text>
<rect x="586.0" y="111.9" width="74.0" height="238.1" rx="3" fill="#e74c3c"/>
<text x="623.0" y="103.9" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d25">92.3%</text>
<text x="623.0" y="368.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1d25">PASS</text>
<text x="623.0" y="383.0" text-anchor="middle" font-size="10" fill="#8899aa">remove genuine junk</text>
<text x="623.0" y="397.0" text-anchor="middle" font-size="10" fill="#8899aa">24/26*</text>
<rect x="744.0" y="290.0" width="74.0" height="60" rx="3" fill="none" stroke="#8899aa" stroke-width="2" stroke-dasharray="5 4"/>
<text x="781.0" y="316.0" text-anchor="middle" font-size="11" fill="#8899aa">not</text>
<text x="781.0" y="330.0" text-anchor="middle" font-size="11" fill="#8899aa">measured</text>
<text x="781.0" y="368.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1d25">Object set</text>
<text x="781.0" y="383.0" text-anchor="middle" font-size="10" fill="#8899aa">reject dolls/statues</text>
<text x="781.0" y="397.0" text-anchor="middle" font-size="10" fill="#8899aa">not run</text>
<text x="70" y="430.0" font-size="11.5" fill="#8899aa">* PASS raw kill rate is 46% (24/52), but owner adjudication found all but ~2 survivors were real people or depictions the benchmark missed;</text>
<text x="70" y="446.0" font-size="11.5" fill="#8899aa">on genuine junk the gate scores ~92%. The CrowdHuman false-positive metric was retired for the same reason (unannotated real people).</text>
</svg>