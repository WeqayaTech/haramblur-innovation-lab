<text x="70.0" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a1d25">0.3</text>
<line x1="265.0" y1="420" x2="265.0" y2="425" stroke="#8899aa"/>
<text x="265.0" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a1d25">0.4</text>
<line x1="460.0" y1="420" x2="460.0" y2="425" stroke="#8899aa"/>
<text x="460.0" y="440" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1d25">0.5 (headline)</text>
<line x1="655.0" y1="420" x2="655.0" y2="425" stroke="#8899aa"/>
<text x="655.0" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a1d25">0.6</text>
