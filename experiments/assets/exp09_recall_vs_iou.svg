<text x="460.0" y="146.2" text-anchor="middle" font-size="12" font-weight="700" fill="#2858dc">78.2%</text>
<circle cx="655.0" cy="177.9" r="4.5" fill="#2858dc"/>
<text x="655.0" y="166.9" text-anchor="middle" font-size="12" font-weight="700" fill="#2858dc">72.0%</text>
<circle cx="850.0" cy="216.5" r="4.5" fill="#2858dc"/>
<text x="850.0" y="205.5" text-anchor="middle" font-size="12" font-weight="700" fill="#2858dc">60.6%</text>
<text x="860.0" y="220.5" font-size="12.5" font-weight="700" fill="#2858dc"></text>
<polyline points="70.0,248.5 265.0,250.7 460.0,254.7 655.0,260.5 850.0,273.1" fill="none" stroke="#e08000" stroke-width="3"/>
