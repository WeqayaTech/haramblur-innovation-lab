<text x="460.0" y="462" text-anchor="middle" font-size="12" fill="#8899aa">IoU threshold required to count a detection as a match (stricter &#8594;)</text>
<line x1="460.0" y1="84" x2="460.0" y2="420" stroke="#dfe3ea" stroke-width="2" stroke-dasharray="5 4"/>
<polyline points="70.0,141.2 265.0,148.0 460.0,157.2 655.0,177.9 850.0,216.5" fill="none" stroke="#2858dc" stroke-width="3"/>
<circle cx="70.0" cy="141.2" r="4.5" fill="#2858dc"/>
