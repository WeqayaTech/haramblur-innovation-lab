<text x="265.0" y="239.7" text-anchor="middle" font-size="12" font-weight="700" fill="#e08000">50.4%</text>
<circle cx="460.0" cy="254.7" r="4.5" fill="#e08000"/>
<text x="460.0" y="243.7" text-anchor="middle" font-size="12" font-weight="700" fill="#e08000">49.2%</text>
<circle cx="655.0" cy="260.5" r="4.5" fill="#e08000"/>
<text x="655.0" y="249.5" text-anchor="middle" font-size="12" font-weight="700" fill="#e08000">47.5%</text>
<circle cx="850.0" cy="273.1" r="4.5" fill="#e08000"/>
<text x="850.0" y="262.1" text-anchor="middle" font-size="12" font-weight="700" fill="#e08000">43.7%</text>
<text x="860.0" y="277.1" font-size="12.5" font-weight="700" fill="#e08000"></text>
<text x="304.0" y="191.0" text-anchor="middle" font-size="12" fill="#2858dc">drops 17.7 pts from 0.5&#8594;0.7:</text>
<text x="304.0" y="205.0" text-anchor="middle" font-size="12" fill="#2858dc">finds people but boxes them loosely</text>
<text x="557.5" y="295.1" text-anchor="middle" font-size="12" fill="#e08000">nearly flat (-5.5 pts): boxes are tight,</text>
<text x="557.5" y="309.1" text-anchor="middle" font-size="12" fill="#e08000">the missing half was never detected at ANY strictness</text>
